[build]
  # Build only the client-side bundle for Netlify deployments
  command = "npm run build:client"
  publish = "dist"

# OPTION 1: Netlify API Proxying (Recommended for regular API requests)
# This avoids any CORS issues and routes all /api/... calls straight to your server.
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-qssxoo2vmqcb6brvxriblu-721377060812.asia-southeast1.run.app/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) Routing Rule
# Redirects all other frontend traffic to index.html so client-side React handles routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

