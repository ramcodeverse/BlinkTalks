<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#glowLeft)" />
  <rect width="1200" height="675" fill="url(#glowRight)" />

  <!-- Top Bar / Window Controls -->
  <rect x="0" y="0" width="1200" height="42" fill="#05080e" opacity="0.8" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#1e293b" stroke-width="1" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <text x="600" y="26" fill="#64748b" font-size="12" text-anchor="middle" class="font">BlinkTalks — Create BlinkTalks ID</text>
  <rect x="1060" y="12" width="112" height="20" rx="4" fill="#0f172a" stroke="#1e293b" />
  <text x="1116" y="26" fill="#38bdf8" font-size="11" text-anchor="middle" class="font">v2.4.0 • Live</text>

  <!-- LEFT COLUMN: Brand & Capability Overview (x: 80, width: 480) -->
  <!-- Logo & Title -->
  <g transform="translate(80, 80)">
    <rect width="44" height="44" rx="12" fill="url(#btnGrad)" />
    <path d="M22 10 L14 24 L21 24 L19 34 L29 20 L22 20 Z" fill="#ffffff" />
    <text x="56" y="30" fill="#ffffff" font-size="24" font-weight="700" class="font" letter-spacing="-0.5">BlinkTalks</text>
    <rect x="180" y="14" width="76" height="20" rx="10" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="218" y="28" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle" class="font">WORKSPACE</text>
  </g>

  <!-- Headline & Subtitle -->
  <text x="80" y="165" fill="#f8fafc" font-size="30" font-weight="700" class="font" letter-spacing="-0.5">Connect. Talk. Stay in Sync.</text>
  <text x="80" y="195" fill="#94a3b8" font-size="14" class="font">Communication and collaboration, in one synchronized workspace.</text>

  <!-- Capability Strip (Interactive preview) -->
  <g transform="translate(80, 225)">
    <text x="0" y="0" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1.2" class="font">CORE PLATFORM PILLARS</text>
    
    <!-- Pills -->
    <rect x="0" y="12" width="84" height="30" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="42" y="31" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle" class="font">💬 CHAT</text>

    <rect x="94" y="12" width="84" height="30" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="136" y="31" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle" class="font">⚡ WORK</text>

    <rect x="188" y="12" width="94" height="30" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="235" y="31" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle" class="font">📊 KANBAN</text>

    <rect x="292" y="12" width="88" height="30" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="336" y="31" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle" class="font">👥 TEAMS</text>

    <rect x="390" y="12" width="96" height="30" rx="6" fill="#0b1329" stroke="#1e293b" />
    <text x="438" y="31" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle" class="font">📁 PROJECTS</text>
  </g>

  <!-- Live Mini Workspace Card (ProductPreviewMini) -->
  <g transform="translate(80, 305)" filter="url(#cardShadow)">
    <rect width="470" height="295" rx="12" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mini Header -->
    <rect width="470" height="38" rx="12" fill="#0d1527" />
    <circle cx="20" cy="19" r="4" fill="#3b82f6" />
    <text x="34" y="23" fill="#e2e8f0" font-size="12" font-weight="600" class="font">Engineering &amp; Product Workspace</text>
    <rect x="375" y="10" width="80" height="18" rx="4" fill="#052e16" stroke="#15803d" stroke-width="1" />
    <text x="415" y="23" fill="#4ade80" font-size="10" font-weight="600" text-anchor="middle" class="font">● 4 Online</text>

    <!-- Mini Project Progress -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" fill="#cbd5e1" font-size="12" font-weight="600" class="font">Website Redesign v2</text>
      <text x="430" y="14" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="end" class="font">72% Completed</text>
      <rect x="0" y="24" width="430" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="24" width="310" height="6" rx="3" fill="url(#btnGrad)" />
    </g>

    <!-- Mini Task List -->
    <g transform="translate(20, 100)">
      <!-- Task 1 -->
      <rect x="0" y="0" width="430" height="42" rx="8" fill="#0d1527" stroke="#1e293b" />
      <rect x="12" y="12" width="18" height="18" rx="4" fill="#15803d" />
      <path d="M16 21 L20 25 L26 17" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="40" y="25" fill="#94a3b8" font-size="11" text-decoration="line-through" class="font">Upgrade Auth Screen UI &amp; Password Meter</text>
      <rect x="362" y="12" width="56" height="18" rx="4" fill="#14532d" />
      <text x="390" y="25" fill="#86efac" font-size="9" font-weight="600" text-anchor="middle" class="font">DONE</text>

      <!-- Task 2 -->
      <rect x="0" y="50" width="430" height="42" rx="8" fill="#0d1527" stroke="#2563eb" stroke-opacity="0.4" />
      <rect x="12" y="62" width="18" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" />
      <text x="40" y="75" fill="#f1f5f9" font-size="11" font-weight="500" class="font">Synchronize WebSocket Channels &amp; Drafts</text>
      <rect x="340" y="62" width="78" height="18" rx="4" fill="#1e3a5f" />
      <text x="379" y="75" fill="#67e8f9" font-size="9" font-weight="600" text-anchor="middle" class="font">IN PROGRESS</text>

      <!-- Task 3 -->
      <rect x="0" y="100" width="430" height="42" rx="8" fill="#0d1527" stroke="#1e293b" />
      <rect x="12" y="112" width="18" height="18" rx="4" fill="#0f172a" stroke="#475569" />
      <text x="40" y="125" fill="#cbd5e1" font-size="11" class="font">Implement Sprint Velocity &amp; Team Directory</text>
      <rect x="358" y="112" width="60" height="18" rx="4" fill="#312e81" />
      <text x="388" y="125" fill="#c7d2fe" font-size="9" font-weight="600" text-anchor="middle" class="font">REVIEW</text>
    </g>

    <line x1="20" y1="258" x2="450" y2="258" stroke="#1e293b" stroke-dasharray="4 4" />
    <text x="20" y="278" fill="#64748b" font-size="10" class="font">🔒 End-to-End Encrypted Messaging (AES-256-GCM)</text>
    <text x="450" y="278" fill="#64748b" font-size="10" text-anchor="end" class="font">⚡ 12ms WebSocket Ping</text>
  </g>

  <!-- RIGHT COLUMN: The Elevated Auth Card (x: 630, width: 490) -->
  <g transform="translate(630, 75)" filter="url(#cardShadow)">
    <rect width="490" height="545" rx="16" fill="#0d1527" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Header Tabs -->
    <rect x="30" y="28" width="430" height="38" rx="8" fill="#070b14" stroke="#1e293b" />
    <rect x="32" y="30" width="212" height="34" rx="6" fill="#1e293b" />
    <text x="138" y="52" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" class="font">Create BlinkTalks ID</text>
    <text x="350" y="52" fill="#64748b" font-size="12" font-weight="500" text-anchor="middle" class="font">Sign In</text>

    <!-- Field 1: Display Name -->
    <g transform="translate(30, 85)">
      <text x="0" y="12" fill="#cbd5e1" font-size="11" font-weight="500" class="font">Display Name</text>
      <rect x="0" y="18" width="430" height="38" rx="8" fill="#070b14" stroke="#334155" />
      <text x="14" y="42" fill="#f8fafc" font-size="12" class="font">Alex Morgan</text>
    </g>

    <!-- Field 2: Username with Live Checkmark -->
    <g transform="translate(30, 155)">
      <text x="0" y="12" fill="#cbd5e1" font-size="11" font-weight="500" class="font">Username</text>
      <text x="430" y="12" fill="#10b981" font-size="10" font-weight="600" text-anchor="end" class="font">✓ @alex_dev is available</text>
      <rect x="0" y="18" width="430" height="38" rx="8" fill="#070b14" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="42" fill="#64748b" font-size="12" class="font">@</text>
      <text x="28" y="42" fill="#f8fafc" font-size="12" class="font">alex_dev</text>
      <circle cx="410" cy="37" r="8" fill="#065f46" />
      <path d="M407 37 L409 39 L414 34" stroke="#34d399" stroke-width="1.5" fill="none" />
    </g>

    <!-- Field 3: Email Address -->
    <g transform="translate(30, 225)">
      <text x="0" y="12" fill="#cbd5e1" font-size="11" font-weight="500" class="font">Email Address</text>
      <rect x="0" y="18" width="430" height="38" rx="8" fill="#070b14" stroke="#334155" />
      <text x="14" y="42" fill="#f8fafc" font-size="12" class="font">alex.morgan@company.io</text>
    </g>

    <!-- Field 4: Password & Strength Meter -->
    <g transform="translate(30, 295)">
      <text x="0" y="12" fill="#cbd5e1" font-size="11" font-weight="500" class="font">Password</text>
      <text x="430" y="12" fill="#10b981" font-size="10" font-weight="600" text-anchor="end" class="font">Strong</text>
      <rect x="0" y="18" width="430" height="38" rx="8" fill="#070b14" stroke="#334155" />
      <text x="14" y="44" fill="#94a3b8" font-size="14" class="mono">•••••••••••••</text>
      
      <!-- Strength Meter Bars -->
      <g transform="translate(0, 62)">
        <rect x="0" y="0" width="103" height="3" rx="1.5" fill="#10b981" />
        <rect x="109" y="0" width="103" height="3" rx="1.5" fill="#10b981" />
        <rect x="218" y="0" width="103" height="3" rx="1.5" fill="#10b981" />
        <rect x="327" y="0" width="103" height="3" rx="1.5" fill="#10b981" />
      </g>
    </g>

    <!-- Field 5: Confirm Password -->
    <g transform="translate(30, 375)">
      <text x="0" y="12" fill="#cbd5e1" font-size="11" font-weight="500" class="font">Confirm Password</text>
      <text x="430" y="12" fill="#10b981" font-size="10" font-weight="600" text-anchor="end" class="font">✓ Passwords match</text>
      <rect x="0" y="18" width="430" height="38" rx="8" fill="#070b14" stroke="#10b981" stroke-width="1.2" />
      <text x="14" y="44" fill="#94a3b8" font-size="14" class="mono">•••••••••••••</text>
    </g>

    <!-- Primary Action Button -->
    <g transform="translate(30, 448)">
      <rect width="430" height="42" rx="8" fill="url(#btnGrad)" />
      <text x="215" y="26" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle" class="font">Create BlinkTalks ID →</text>
    </g>

    <!-- Terms & Note -->
    <text x="245" y="515" fill="#64748b" font-size="10" text-anchor="middle" class="font">
      By creating an ID, you accept the Terms of Service &amp; Privacy Protocol
    </text>
  </g>
</svg>
