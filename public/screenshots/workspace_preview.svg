<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="taskShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad2)" />

  <!-- Top App Header -->
  <rect width="1200" height="52" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(24, 12)">
    <rect width="28" height="28" rx="8" fill="url(#primaryGrad)" />
    <path d="M14 6 L9 15 L14 15 L12 22 L19 12 L14 12 Z" fill="#ffffff" />
    <text x="38" y="20" fill="#ffffff" font-size="16" font-weight="700" class="font">BlinkTalks</text>
  </g>

  <!-- Global Workspace Switcher -->
  <g transform="translate(180, 10)">
    <rect width="210" height="32" rx="6" fill="#070b14" stroke="#1e293b" />
    <circle cx="16" cy="16" r="4" fill="#10b981" />
    <text x="28" y="21" fill="#f8fafc" font-size="12" font-weight="600" class="font">Engineering &amp; Product ▾</text>
  </g>

  <!-- Nav Tabs -->
  <g transform="translate(420, 16)">
    <text x="0" y="16" fill="#64748b" font-size="12" font-weight="500" class="font">💬 Chat Channels</text>
    <rect x="120" y="-4" width="85" height="28" rx="6" fill="#1e293b" />
    <text x="132" y="15" fill="#38bdf8" font-size="12" font-weight="600" class="font">📊 Kanban</text>
    <text x="235" y="16" fill="#64748b" font-size="12" font-weight="500" class="font">📁 Projects</text>
    <text x="325" y="16" fill="#64748b" font-size="12" font-weight="500" class="font">📅 Calendar</text>
    <text x="415" y="16" fill="#64748b" font-size="12" font-weight="500" class="font">👥 Teams</text>
  </g>

  <!-- Right Profile & Quick Actions -->
  <g transform="translate(1010, 12)">
    <rect width="80" height="28" rx="6" fill="url(#primaryGrad)" />
    <text x="40" y="18" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle" class="font">+ New Task</text>
    <circle cx="110" cy="14" r="14" fill="#334155" />
    <text x="110" y="18" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle" class="font">AM</text>
    <circle cx="121" cy="23" r="4" fill="#10b981" />
  </g>

  <!-- Subheader / Filter Bar -->
  <rect x="0" y="52" width="1200" height="48" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
  <text x="24" y="82" fill="#ffffff" font-size="16" font-weight="700" class="font">Sprint 14: Platform Foundation</text>
  <rect x="270" y="66" width="68" height="22" rx="4" fill="#1e1b4b" stroke="#4338ca" />
  <text x="304" y="81" fill="#a5b4fc" font-size="10" font-weight="600" text-anchor="middle" class="font">Active Sprint</text>

  <!-- KANBAN COLUMNS -->
  <!-- Column 1: TO DO (x: 24, width: 270) -->
  <g transform="translate(24, 115)">
    <rect width="270" height="535" rx="10" fill="#0b1329" stroke="#1e293b" />
    <circle cx="20" cy="22" r="5" fill="#64748b" />
    <text x="34" y="26" fill="#cbd5e1" font-size="13" font-weight="600" class="font">To Do</text>
    <rect x="228" y="12" width="26" height="20" rx="10" fill="#1e293b" />
    <text x="241" y="26" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" class="font">3</text>

    <!-- Card 1 -->
    <g transform="translate(12, 48)" filter="url(#taskShadow)">
      <rect width="246" height="118" rx="8" fill="#0f172a" stroke="#1e293b" />
      <rect x="12" y="12" width="52" height="18" rx="4" fill="#450a0a" stroke="#991b1b" />
      <text x="38" y="24" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle" class="font">URGENT</text>
      <text x="12" y="52" fill="#f1f5f9" font-size="12" font-weight="600" class="font">Database Partitioning &amp; Index</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10" class="font">Optimize message read performance</text>
      <text x="12" y="100" fill="#64748b" font-size="10" class="font">📅 Sep 18</text>
      <circle cx="220" cy="96" r="10" fill="#1e293b" />
      <text x="220" y="99" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle" class="font">JD</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(12, 178)" filter="url(#taskShadow)">
      <rect width="246" height="106" rx="8" fill="#0f172a" stroke="#1e293b" />
      <rect x="12" y="12" width="46" height="18" rx="4" fill="#422006" stroke="#854d0e" />
      <text x="35" y="24" fill="#fde047" font-size="9" font-weight="700" text-anchor="middle" class="font">MEDIUM</text>
      <text x="12" y="52" fill="#f1f5f9" font-size="12" font-weight="600" class="font">Dark Mode Accessibility Audit</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10" class="font">Verify WCAG contrast compliance</text>
      <text x="12" y="92" fill="#64748b" font-size="10" class="font">📅 Sep 22</text>
    </g>
  </g>

  <!-- Column 2: IN PROGRESS (x: 318, width: 270) -->
  <g transform="translate(318, 115)">
    <rect width="270" height="535" rx="10" fill="#0b1329" stroke="#2563eb" stroke-opacity="0.3" />
    <circle cx="20" cy="22" r="5" fill="#38bdf8" />
    <text x="34" y="26" fill="#cbd5e1" font-size="13" font-weight="600" class="font">In Progress</text>
    <rect x="228" y="12" width="26" height="20" rx="10" fill="#1e3a5f" />
    <text x="241" y="26" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="font">2</text>

    <!-- Card Active Drag/Focus -->
    <g transform="translate(12, 48)" filter="url(#taskShadow)">
      <rect width="246" height="126" rx="8" fill="#0f1a34" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="12" y="12" width="40" height="18" rx="4" fill="#7f1d1d" stroke="#b91c1c" />
      <text x="32" y="24" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle" class="font">HIGH</text>
      <rect x="60" y="12" width="56" height="18" rx="4" fill="#064e3b" />
      <text x="88" y="24" fill="#6ee7b7" font-size="9" font-weight="600" text-anchor="middle" class="font">AUTH UI</text>
      <text x="12" y="52" fill="#f8fafc" font-size="12" font-weight="600" class="font">Overhaul Auth Screen &amp; Meter</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10" class="font">Two-column layout, debounced checks</text>
      <text x="12" y="98" fill="#38bdf8" font-size="10" class="font">☑ 4/4 Subtasks Completed</text>
      <circle cx="220" cy="104" r="10" fill="#3b82f6" />
      <text x="220" y="107" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle" class="font">AM</text>
    </g>

    <g transform="translate(12, 186)" filter="url(#taskShadow)">
      <rect width="246" height="114" rx="8" fill="#0f172a" stroke="#1e293b" />
      <rect x="12" y="12" width="46" height="18" rx="4" fill="#422006" />
      <text x="35" y="24" fill="#fde047" font-size="9" font-weight="700" text-anchor="middle" class="font">MEDIUM</text>
      <text x="12" y="52" fill="#f1f5f9" font-size="12" font-weight="600" class="font">WebSocket Channel Reconnection</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10" class="font">Exponential backoff with jitter</text>
      <text x="12" y="96" fill="#64748b" font-size="10" class="font">📅 Sep 15</text>
    </g>
  </g>

  <!-- Column 3: IN REVIEW (x: 612, width: 270) -->
  <g transform="translate(612, 115)">
    <rect width="270" height="535" rx="10" fill="#0b1329" stroke="#1e293b" />
    <circle cx="20" cy="22" r="5" fill="#a855f7" />
    <text x="34" y="26" fill="#cbd5e1" font-size="13" font-weight="600" class="font">In Review</text>
    <rect x="228" y="12" width="26" height="20" rx="10" fill="#1e293b" />
    <text x="241" y="26" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" class="font">1</text>

    <g transform="translate(12, 48)" filter="url(#taskShadow)">
      <rect width="246" height="114" rx="8" fill="#0f172a" stroke="#1e293b" />
      <rect x="12" y="12" width="40" height="18" rx="4" fill="#7f1d1d" />
      <text x="32" y="24" fill="#fca5a5" font-size="9" font-weight="700" text-anchor="middle" class="font">HIGH</text>
      <text x="12" y="52" fill="#f1f5f9" font-size="12" font-weight="600" class="font">Invitation URL Routing &amp; Cards</text>
      <text x="12" y="70" fill="#94a3b8" font-size="10" class="font">Contextual workspace preview token</text>
      <text x="12" y="96" fill="#64748b" font-size="10" class="font">📅 Ready for QA</text>
      <circle cx="220" cy="94" r="10" fill="#6366f1" />
      <text x="220" y="97" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle" class="font">SK</text>
    </g>
  </g>

  <!-- Column 4: COMPLETED (x: 906, width: 270) -->
  <g transform="translate(906, 115)">
    <rect width="270" height="535" rx="10" fill="#0b1329" stroke="#1e293b" />
    <circle cx="20" cy="22" r="5" fill="#10b981" />
    <text x="34" y="26" fill="#cbd5e1" font-size="13" font-weight="600" class="font">Completed</text>
    <rect x="228" y="12" width="26" height="20" rx="10" fill="#064e3b" />
    <text x="241" y="26" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle" class="font">8</text>

    <g transform="translate(12, 48)" filter="url(#taskShadow)">
      <rect width="246" height="106" rx="8" fill="#0f172a" stroke="#1e293b" opacity="0.8" />
      <rect x="12" y="12" width="46" height="18" rx="4" fill="#14532d" />
      <text x="35" y="24" fill="#86efac" font-size="9" font-weight="700" text-anchor="middle" class="font">DONE</text>
      <text x="12" y="52" fill="#94a3b8" font-size="12" text-decoration="line-through" class="font">AES-256-GCM Payload Encryption</text>
      <text x="12" y="70" fill="#64748b" font-size="10" class="font">Zero plaintext at rest verification</text>
      <text x="12" y="92" fill="#10b981" font-size="10" class="font">✓ Verified on Staging</text>
    </g>
  </g>
</svg>
