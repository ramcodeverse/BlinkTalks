<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="gradPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="1200" height="675" fill="url(#bgGrad3)" />

  <!-- Top App Header -->
  <rect width="1200" height="52" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(24, 12)">
    <rect width="28" height="28" rx="8" fill="url(#gradPill)" />
    <path d="M14 6 L9 15 L14 15 L12 22 L19 12 L14 12 Z" fill="#ffffff" />
    <text x="38" y="20" fill="#ffffff" font-size="16" font-weight="700" class="font">BlinkTalks</text>
  </g>

  <!-- Left Sidebar (Channels & DMs) (width: 280) -->
  <rect x="0" y="52" width="280" height="623" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
  
  <!-- Sidebar Header -->
  <g transform="translate(20, 72)">
    <text x="0" y="14" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1" class="font">WORKSPACE CHANNELS</text>
    <text x="240" y="14" fill="#64748b" font-size="14" font-weight="700" text-anchor="end" class="font">+</text>
    
    <!-- Channel 1 (Active) -->
    <rect x="-8" y="28" width="256" height="34" rx="6" fill="#1e293b" />
    <text x="10" y="50" fill="#38bdf8" font-size="13" font-weight="600" class="font"># platform-core</text>
    <rect x="220" y="37" width="20" height="16" rx="8" fill="#2563eb" />
    <text x="230" y="49" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" class="font">3</text>

    <!-- Channel 2 -->
    <text x="10" y="88" fill="#94a3b8" font-size="13" class="font"># release-announcements</text>
    <!-- Channel 3 -->
    <text x="10" y="122" fill="#94a3b8" font-size="13" class="font"># sprint-planning</text>

    <!-- DMs Header -->
    <text x="0" y="170" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1" class="font">DIRECT MESSAGES</text>
    <g transform="translate(0, 186)">
      <circle cx="16" cy="14" r="10" fill="#334155" />
      <text x="16" y="17" fill="#f8fafc" font-size="9" font-weight="600" text-anchor="middle" class="font">SK</text>
      <circle cx="23" cy="21" r="3" fill="#10b981" />
      <text x="36" y="18" fill="#e2e8f0" font-size="12" class="font">Sarah Kim</text>
    </g>
    <g transform="translate(0, 226)">
      <circle cx="16" cy="14" r="10" fill="#334155" />
      <text x="16" y="17" fill="#f8fafc" font-size="9" font-weight="600" text-anchor="middle" class="font">JD</text>
      <circle cx="23" cy="21" r="3" fill="#f59e0b" />
      <text x="36" y="18" fill="#cbd5e1" font-size="12" class="font">John Doe</text>
    </g>
  </g>

  <!-- Chat Area Main Column (x: 280, width: 920) -->
  <!-- Channel Banner -->
  <rect x="280" y="52" width="920" height="48" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
  <text x="304" y="82" fill="#ffffff" font-size="15" font-weight="700" class="font"># platform-core</text>
  <rect x="420" y="66" width="130" height="20" rx="4" fill="#064e3b" stroke="#059669" />
  <text x="485" y="80" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle" class="font">🔒 AES-256-GCM Encrypted</text>
  <text x="1170" y="82" fill="#64748b" font-size="12" text-anchor="end" class="font">14 Members Online</text>

  <!-- Message Thread Container -->
  <!-- Message 1 -->
  <g transform="translate(304, 130)">
    <circle cx="18" cy="18" r="18" fill="#3b82f6" />
    <text x="18" y="23" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" class="font">SK</text>
    <text x="48" y="16" fill="#f8fafc" font-size="13" font-weight="600" class="font">Sarah Kim</text>
    <text x="120" y="16" fill="#64748b" font-size="11" class="font">Today at 10:24 AM</text>
    <text x="48" y="42" fill="#cbd5e1" font-size="13" class="font">The new authentication redesign is ready for QA staging. Debounced checks are passing with 200ms debounce.</text>
    
    <!-- Reaction Chips -->
    <g transform="translate(48, 56)">
      <rect width="46" height="22" rx="11" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="23" y="15" fill="#93c5fd" font-size="11" text-anchor="middle" class="font">🚀 5</text>
      <rect x="52" y="0" width="46" height="22" rx="11" fill="#1e293b" />
      <text x="75" y="15" fill="#cbd5e1" font-size="11" text-anchor="middle" class="font">🔥 3</text>
    </g>
  </g>

  <!-- Message 2 (Quoted Reply) -->
  <g transform="translate(304, 235)">
    <circle cx="18" cy="18" r="18" fill="#6366f1" />
    <text x="18" y="23" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle" class="font">AM</text>
    <text x="48" y="16" fill="#f8fafc" font-size="13" font-weight="600" class="font">Alex Morgan</text>
    <text x="135" y="16" fill="#64748b" font-size="11" class="font">Today at 10:26 AM</text>
    
    <!-- Quote Bar -->
    <g transform="translate(48, 28)">
      <rect width="520" height="28" rx="4" fill="#090f1d" stroke="#1e293b" />
      <rect width="3" height="28" rx="1.5" fill="#3b82f6" />
      <text x="12" y="18" fill="#64748b" font-size="11" class="font">Replying to @Sarah Kim: The new authentication redesign is ready for QA...</text>
    </g>
    <text x="48" y="80" fill="#cbd5e1" font-size="13" class="font">Tested the invitation code routing and password meter locally. Smooth and zero lag.</text>

    <!-- Reaction -->
    <g transform="translate(48, 94)">
      <rect width="46" height="22" rx="11" fill="#1e293b" />
      <text x="23" y="15" fill="#cbd5e1" font-size="11" text-anchor="middle" class="font">👍 4</text>
    </g>
  </g>

  <!-- Live Typing Indicator -->
  <g transform="translate(352, 570)">
    <circle cx="4" cy="4" r="2" fill="#38bdf8" />
    <circle cx="12" cy="4" r="2" fill="#38bdf8" />
    <circle cx="20" cy="4" r="2" fill="#38bdf8" />
    <text x="32" y="8" fill="#94a3b8" font-size="11" class="font">Sarah Kim is typing...</text>
  </g>

  <!-- Message Composer (Fixed at bottom) -->
  <g transform="translate(304, 595)">
    <rect width="872" height="52" rx="10" fill="#0d1527" stroke="#334155" stroke-width="1.2" />
    <text x="20" y="32" fill="#64748b" font-size="13" class="font">Message #platform-core (Enter to send, Shift+Enter for newline)...</text>
    
    <!-- Action Icons -->
    <circle cx="780" cy="26" r="14" fill="#1e293b" />
    <text x="780" y="30" fill="#94a3b8" font-size="12" text-anchor="middle" class="font">📎</text>

    <circle cx="815" cy="26" r="14" fill="#1e293b" />
    <text x="815" y="30" fill="#94a3b8" font-size="12" text-anchor="middle" class="font">😀</text>

    <rect x="840" y="12" width="28" height="28" rx="6" fill="url(#gradPill)" />
    <path d="M848 26 L860 21 L855 31 Z" fill="#ffffff" />
  </g>
</svg>
